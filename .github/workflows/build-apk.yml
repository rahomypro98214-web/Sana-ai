name: Build Sana AI APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'SanaAI-Android-Cloud-Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q SanaAI-Android-Cloud-Build.zip -d /tmp/sana-project
          cp -a /tmp/sana-project/SanaAI-Android/. .

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path('app/build.gradle')
          if not gradle_file.exists():
              gradle_file = Path('app/build.gradle.kts')
          if not gradle_file.exists():
              raise SystemExit('Could not find app/build.gradle or app/build.gradle.kts')

          source = gradle_file.read_text()
          java_block = '''\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n'''
          kotlin_block = '''\n kotlinOptions {\n jvmTarget = "17"\n }\n'''

          if gradle_file.suffix == '.kts':
              java_block = '''\n compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n'''
              kotlin_block = '''\n kotlinOptions {\n jvmTarget = "17"\n }\n'''

          if 'compileOptions' not in source:
              source = re.sub(r'android\s*\{', lambda m: m.group(0) + java_block, source, count=1)
          else:
              source = re.sub(r'targetCompatibility\s*=?.*', 'targetCompatibility = JavaVersion.VERSION_17', source, count=1)
              source = re.sub(r'sourceCompatibility\s*=?.*', 'sourceCompatibility = JavaVersion.VERSION_17', source, count=1)

          if 'kotlinOptions' not in source:
              source = re.sub(r'android\s*\{', lambda m: m.group(0) + kotlin_block, source, count=1)
          else:
              source = re.sub(r'jvmTarget\s*=?.*', 'jvmTarget = "17"', source, count=1)

          gradle_file.write_text(source)
          print(f'Updated JVM targets in {gradle_file}')
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SanaAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
